name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creator_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://creator_test:local_test_only@127.0.0.1:5432/creator_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Install and verify Helm
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          sha256sum -c helm-v4.3.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          echo "HELM_BINARY=$RUNNER_TEMP/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Lint deployment chart
        run: '"$HELM_BINARY" lint charts/creators --set image.repository=creators --set image.tag=test'
      - name: Test
        run: python -m pytest
      - name: Build production container
        run: docker build -t creators-ci .
