services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: creators
      POSTGRES_USER: creators
      POSTGRES_PASSWORD: creators
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - dev

  s3:
    image: adobe/s3mock:5.2.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: creators
      COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /tmp/s3-data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # /tmp inherits writable permissions for the image's non-root user.
      - s3_data:/tmp
    networks:
      - dev

volumes:
  postgres_data:
  s3_data:

networks:
  dev:
    name: creators-dev
    external: true
